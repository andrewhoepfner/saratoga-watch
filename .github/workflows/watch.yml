name: 17 Saratoga complaint watch

on:
  schedule:
    # BACKUP ONLY. The main trigger is the cron-job.org timer at 9:30am/pm.
    # GitHub often runs these hours late; watch.py skips them if the timer
    # already ran that check. Times are UTC, with summer and winter versions.
    - cron: "30 13 * * *" # morning, daylight time
    - cron: "30 1 * * *"  # evening, daylight time
    - cron: "30 14 * * *" # morning, standard time
    - cron: "30 2 * * *"  # evening, standard time
  workflow_dispatch: # the "Run workflow" button, and what the timer calls
    inputs:
      check:
        description: "Which check (morning, evening, or manual)"
        default: manual
        type: choice
        options: [manual, morning, evening]

permissions:
  contents: write # lets the job save state.json back to the repo

concurrency: complaint-watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # always use the latest code, even when re-running an old run

      - name: Check city records
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          CHECK: ${{ inputs.check }}
        run: python3 watch.py

      - name: Remember what was seen
        run: |
          git config user.name "complaint-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json complaints.md
          git commit -m "Check $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          # If the repo changed while this ran, catch up and try again.
          git push || (git pull --rebase -X theirs && git push)
